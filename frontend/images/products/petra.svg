<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" rx="24" fill="#F5F0E8"/>
  <!-- T-shirt shape -->
  <path d="M120,100 L100,100 L60,140 L90,170 L110,150 L110,360 L290,360 L290,150 L310,170 L340,140 L300,100 L280,100 L260,120 C245,135 155,135 140,120 Z" fill="#FAFAF7" stroke="#E8E3D8" stroke-width="2"/>
  <!-- Petra Treasury facade silhouette -->
  <g transform="translate(150,170)" fill="#2D5016">
    <!-- Main facade -->
    <rect x="10" y="30" width="80" height="90" rx="2"/>
    <!-- Columns -->
    <rect x="15" y="35" width="6" height="80" rx="1" fill="#F5F0E8" opacity="0.5"/>
    <rect x="35" y="35" width="6" height="80" rx="1" fill="#F5F0E8" opacity="0.5"/>
    <rect x="59" y="35" width="6" height="80" rx="1" fill="#F5F0E8" opacity="0.5"/>
    <rect x="79" y="35" width="6" height="80" rx="1" fill="#F5F0E8" opacity="0.5"/>
    <!-- Top pediment / triangular -->
    <polygon points="50,0 10,30 90,30" fill="#2D5016"/>
    <!-- Urn on top -->
    <ellipse cx="50" cy="5" rx="8" ry="6" fill="#2D5016"/>
    <rect x="47" y="0" width="6" height="4" rx="1" fill="#2D5016"/>
    <!-- Door -->
    <rect x="36" y="80" width="28" height="40" rx="14" fill="#F5F0E8" opacity="0.6"/>
    <!-- Rock walls -->
    <path d="M0,25 Q5,10 10,30 L10,120 L0,120 Z" fill="#2D5016" opacity="0.5"/>
    <path d="M100,25 Q95,10 90,30 L90,120 L100,120 Z" fill="#2D5016" opacity="0.5"/>
  </g>
  <!-- SEASO text -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#2D5016">SEASO</text>
  <!-- Product name -->
  <text x="200" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">Pétra</text>
  <text x="200" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#999">Jordanie</text>
</svg>