<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" rx="24" fill="#F5F0E8"/>
  <!-- T-shirt shape -->
  <path d="M120,100 L100,100 L60,140 L90,170 L110,150 L110,360 L290,360 L290,150 L310,170 L340,140 L300,100 L280,100 L260,120 C245,135 155,135 140,120 Z" fill="#FAFAF7" stroke="#E8E3D8" stroke-width="2"/>
  <!-- Chichen Itza pyramid silhouette -->
  <g transform="translate(140,175)" fill="#2D5016">
    <!-- Pyramid steps -->
    <rect x="30" y="0" width="60" height="12" rx="1"/>
    <rect x="24" y="12" width="72" height="12" rx="1" opacity="0.95"/>
    <rect x="18" y="24" width="84" height="12" rx="1" opacity="0.9"/>
    <rect x="12" y="36" width="96" height="12" rx="1" opacity="0.85"/>
    <rect x="6" y="48" width="108" height="12" rx="1" opacity="0.8"/>
    <rect x="0" y="60" width="120" height="12" rx="1" opacity="0.75"/>
    <!-- Temple on top -->
    <rect x="42" y="-18" width="36" height="20" rx="2"/>
    <rect x="48" y="-22" width="24" height="6" rx="1"/>
    <!-- Door -->
    <rect x="52" y="-10" width="16" height="12" rx="2" fill="#F5F0E8" opacity="0.5"/>
    <!-- Stairs center -->
    <rect x="50" y="0" width="20" height="72" rx="0" fill="#2D5016" opacity="0.15"/>
    <!-- Step lines -->
    <line x1="50" y1="12" x2="70" y2="12" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="24" x2="70" y2="24" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="36" x2="70" y2="36" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="48" x2="70" y2="48" stroke="#F5F0E8" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- SEASO text -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#2D5016">SEASO</text>
  <!-- Product name -->
  <text x="200" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">Chichén Itzá</text>
  <text x="200" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#999">Mexique</text>
</svg>