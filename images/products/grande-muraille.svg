<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" rx="24" fill="#F5F0E8"/>
  <!-- T-shirt shape -->
  <path d="M120,100 L100,100 L60,140 L90,170 L110,150 L110,360 L290,360 L290,150 L310,170 L340,140 L300,100 L280,100 L260,120 C245,135 155,135 140,120 Z" fill="#FAFAF7" stroke="#E8E3D8" stroke-width="2"/>
  <!-- Great Wall silhouette -->
  <g transform="translate(130,180)" fill="#2D5016">
    <rect x="0" y="60" width="12" height="25" rx="1"/>
    <rect x="16" y="50" width="12" height="35" rx="1"/>
    <rect x="32" y="40" width="12" height="45" rx="1"/>
    <rect x="48" y="30" width="12" height="55" rx="1"/>
    <rect x="64" y="20" width="12" height="65" rx="1"/>
    <rect x="80" y="25" width="12" height="60" rx="1"/>
    <rect x="96" y="35" width="12" height="50" rx="1"/>
    <rect x="112" y="45" width="12" height="40" rx="1"/>
    <rect x="128" y="55" width="12" height="30" rx="1"/>
    <!-- Wall connecting line -->
    <rect x="0" y="70" width="140" height="8" rx="2" opacity="0.6"/>
    <!-- Tower tops -->
    <rect x="28" y="33" width="20" height="8" rx="1" opacity="0.4"/>
    <rect x="60" y="13" width="20" height="8" rx="1" opacity="0.4"/>
    <rect x="92" y="28" width="20" height="8" rx="1" opacity="0.4"/>
  </g>
  <!-- SEASO text -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#2D5016">SEASO</text>
  <!-- Product name -->
  <text x="200" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">Grande Muraille</text>
  <text x="200" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#999">Chine</text>
</svg>