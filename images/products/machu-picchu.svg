<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" rx="24" fill="#F5F0E8"/>
  <!-- T-shirt shape -->
  <path d="M120,100 L100,100 L60,140 L90,170 L110,150 L110,360 L290,360 L290,150 L310,170 L340,140 L300,100 L280,100 L260,120 C245,135 155,135 140,120 Z" fill="#FAFAF7" stroke="#E8E3D8" stroke-width="2"/>
  <!-- Machu Picchu silhouette -->
  <g transform="translate(130,175)" fill="#2D5016">
    <!-- Background mountain (Huayna Picchu) -->
    <polygon points="70,0 40,60 100,60" fill="#2D5016" opacity="0.3"/>
    <!-- Smaller mountain -->
    <polygon points="110,25 85,60 135,60" fill="#2D5016" opacity="0.2"/>
    <!-- Terraces -->
    <rect x="15" y="60" width="110" height="8" rx="1" opacity="0.7"/>
    <rect x="20" y="72" width="100" height="8" rx="1" opacity="0.6"/>
    <rect x="25" y="84" width="90" height="8" rx="1" opacity="0.5"/>
    <!-- Ruins/buildings on top -->
    <rect x="30" y="50" width="12" height="14" rx="1"/>
    <rect x="48" y="45" width="15" height="19" rx="1"/>
    <rect x="68" y="48" width="10" height="16" rx="1"/>
    <rect x="84" y="50" width="14" height="14" rx="1"/>
    <!-- Stone walls detail -->
    <rect x="50" y="52" width="3" height="8" fill="#F5F0E8" opacity="0.3"/>
    <rect x="57" y="52" width="3" height="8" fill="#F5F0E8" opacity="0.3"/>
  </g>
  <!-- SEASO text -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#2D5016">SEASO</text>
  <!-- Product name -->
  <text x="200" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">Machu Picchu</text>
  <text x="200" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#999">Pérou</text>
</svg>