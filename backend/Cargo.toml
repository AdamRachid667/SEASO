[package]
name = "seaso-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
stripe = { version = "0.34", package = "async-stripe", features = ["runtime-tokio-hyper"] }